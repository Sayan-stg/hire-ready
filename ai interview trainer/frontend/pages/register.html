<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — HireReady</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --void:#050507;
  --line: rgba(232,233,237,0.09);
  --line-strong: rgba(232,233,237,0.18);
  --silver:#e9eaef;
  --silver-dim:#9395a3;
  --silver-faint:#5c5e6c;
  --nebula:#2b3a67;
  --nebula-bright:#4a5f9e;
  --aurora:#6f7fae;
  --cyan:#5fd4d9;
  --cyan-glow: rgba(95,212,217,0.35);
  --ease: cubic-bezier(.16,.8,.24,1);
}

*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; }

body{
  background:var(--void);
  color:var(--silver);
  font-family:'Inter', sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow-x:hidden;
}

::selection{ background:var(--nebula-bright); color:#fff; }
a{ color:inherit; text-decoration:none; }
.mono{ font-family:'JetBrains Mono', monospace; letter-spacing:.04em; }

/* ambient */
.stars{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.5) 0%, transparent 60%),
    radial-gradient(1px 1px at 78% 8%, rgba(255,255,255,.35) 0%, transparent 60%),
    radial-gradient(1.5px 1.5px at 34% 62%, rgba(255,255,255,.45) 0%, transparent 60%),
    radial-gradient(1px 1px at 91% 44%, rgba(255,255,255,.3) 0%, transparent 60%),
    radial-gradient(1px 1px at 55% 82%, rgba(255,255,255,.4) 0%, transparent 60%),
    radial-gradient(1.5px 1.5px at 6% 88%, rgba(255,255,255,.28) 0%, transparent 60%),
    radial-gradient(1px 1px at 68% 30%, rgba(255,255,255,.35) 0%, transparent 60%);
}
.glow-a{
  position:fixed; z-index:0; pointer-events:none;
  top:-18%; left:50%; transform:translateX(-50%);
  width:900px; height:600px;
  background:radial-gradient(ellipse, rgba(43,58,103,.32), transparent 65%);
  filter:blur(10px);
}
.orbit-ring{
  position:fixed; z-index:0; pointer-events:none;
  top:50%; left:50%; transform:translate(-50%,-50%);
  width:760px; height:760px;
}
.orbit-ring svg{ width:100%; height:100%; }

/* top bar */
.topbar{
  position:relative; z-index:2;
  display:flex; justify-content:space-between; align-items:center;
  padding:32px 40px;
}
.back-link{
  font-size:12.5px; color:var(--silver-faint); display:flex; align-items:center; gap:8px;
  transition:color .3s var(--ease);
}
.back-link:hover{ color:var(--silver-dim); }
.tag{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.14em;
  color:var(--silver-faint); text-transform:uppercase;
}

/* main */
main{
  flex:1; position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 20px 60px;
}

.brand{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-bottom:36px; }
.brand svg{ width:38px; height:38px; }
.brand-word{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; }
.brand-word b{ font-weight:600; }
.brand-sub{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.18em; color:var(--silver-faint); text-transform:uppercase; }

.card{
  width:100%; max-width:400px;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--line-strong);
  border-radius:6px;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:40px 36px 32px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.7);
  animation:cardIn .7s var(--ease) both;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(14px) scale(.985); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.card h1{
  font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:500; text-align:center;
  margin-bottom:6px;
}
.card .lead{
  text-align:center; font-size:13px; color:var(--silver-dim); margin-bottom:30px;
}

.field{ position:relative; margin-bottom:24px; }
.field label{
  display:block; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--silver-faint); margin-bottom:10px;
}
.field .input-row{ position:relative; display:flex; align-items:center; }
.field input{
  width:100%; background:transparent; border:none; outline:none;
  border-bottom:1px solid var(--line-strong);
  color:var(--silver); font-family:'Inter',sans-serif; font-size:14.5px;
  padding:8px 2px 10px; transition:border-color .35s var(--ease), box-shadow .35s var(--ease);
}
.field input::placeholder{ color:var(--silver-faint); }
.field input:focus{
  border-bottom-color:var(--cyan);
  box-shadow:0 1px 0 0 var(--cyan), 0 6px 18px -8px var(--cyan-glow);
}
.field .toggle-visibility{
  position:absolute; right:2px; bottom:10px;
  color:var(--silver-faint); cursor:pointer; padding:2px;
  transition:color .3s var(--ease);
}
.field .toggle-visibility:hover{ color:var(--silver-dim); }
.field .toggle-visibility svg{ width:17px; height:17px; display:block; }

.hint{
  font-size:11px; color:var(--silver-faint); margin-top:8px;
}
.hint.match{ color:var(--cyan); }

.auth-error {
  padding: 10px 14px;
  background: rgba(198, 91, 78, 0.15);
  border: 1px solid rgba(198, 91, 78, 0.4);
  border-radius: 4px;
  color: #e5877c;
  font-size: 12px;
  margin-bottom: 20px;
  display: none;
  text-align: center;
}

.terms-row{
  display:flex; align-items:flex-start; gap:10px; margin:22px 0 26px;
}
.terms-row input[type="checkbox"]{
  appearance:none; -webkit-appearance:none;
  width:15px; height:15px; min-width:15px; margin-top:1px;
  border:1px solid var(--line-strong); border-radius:2px;
  background:transparent; cursor:pointer; position:relative;
  transition:border-color .3s var(--ease), background .3s var(--ease);
}
.terms-row input[type="checkbox"]:checked{
  border-color:var(--cyan); background:rgba(95,212,217,0.12);
}
.terms-row input[type="checkbox"]:checked::after{
  content:''; position:absolute; left:4px; top:1px;
  width:4px; height:8px; border:solid var(--cyan);
  border-width:0 1.5px 1.5px 0; transform:rotate(45deg);
}
.terms-row label{
  font-size:12px; color:var(--silver-dim); line-height:1.55; cursor:pointer;
}
.terms-row a{ color:var(--aurora); border-bottom:1px solid rgba(111,127,174,.4); }
.terms-row a:hover{ color:var(--silver); border-color:var(--silver); }

.btn-primary{
  width:100%; background:var(--silver); color:var(--void);
  border:none; padding:14px; font-family:'Inter',sans-serif; font-size:14px; font-weight:600;
  border-radius:3px; cursor:pointer; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .25s var(--ease), background .25s var(--ease), opacity .25s;
}
.btn-primary:hover{ transform:translateY(-1px); background:#fff; }
.btn-primary:active{ transform:translateY(0); }
.btn-primary[disabled]{ opacity:.6; cursor:default; transform:none; }

.spinner{
  width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(5,5,7,.25); border-top-color:var(--void);
  animation:spin .7s linear infinite; display:none;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.btn-primary.loading .spinner{ display:inline-block; }
.btn-primary.loading .btn-text{ opacity:.7; }

.card-alt{
  width:100%; max-width:400px;
  border:1px solid var(--line); border-radius:6px;
  margin-top:14px; padding:22px 36px;
  text-align:center; font-size:13.5px; color:var(--silver-dim);
  background:rgba(255,255,255,0.012);
}
.card-alt a{ color:var(--silver); font-weight:500; border-bottom:1px solid var(--line-strong); padding-bottom:1px; }
.card-alt a:hover{ border-color:var(--silver); }

footer{
  position:relative; z-index:2; text-align:center; padding:0 20px 40px;
}
footer .foot-links{ display:flex; justify-content:center; gap:24px; margin-bottom:14px; }
footer .foot-links a{ font-size:11.5px; color:var(--silver-faint); }
footer .foot-links a:hover{ color:var(--silver-dim); }
footer .copy{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--silver-faint); letter-spacing:.06em; }

@media(max-width:480px){
  .topbar{ padding:24px 20px; }
  .card{ padding:32px 24px 26px; }
  .card-alt{ padding:20px 24px; }
}
</style>
</head>
<body>

<div class="stars"></div>
<div class="glow-a"></div>
<div class="orbit-ring">
  <svg viewBox="0 0 760 760">
    <ellipse cx="380" cy="380" rx="360" ry="150" stroke="rgba(232,233,237,0.05)" stroke-width="1" fill="none" transform="rotate(-16 380 380)"/>
    <ellipse cx="380" cy="380" rx="260" ry="260" stroke="rgba(232,233,237,0.04)" stroke-width="1" fill="none"/>
    <ellipse cx="380" cy="380" rx="260" ry="105" stroke="rgba(74,95,158,0.14)" stroke-width="1" fill="none" transform="rotate(20 380 380)"/>
  </svg>
</div>

<div class="topbar">
  <a href="../index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 18l-6-6 6-6"/></svg>
    HireReady
  </a>
  <span class="tag">New Crew Registration</span>
</div>

<main>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="12.5" stroke="#8b8d98" stroke-width="1"/>
      <ellipse cx="16" cy="16" rx="12.5" ry="5.5" stroke="#4a5f9e" stroke-width="1" transform="rotate(-28 16 16)"/>
      <path d="M18.5 9.5c-4 0-6.5 3.4-6.5 7.4 0 3 1.8 5.1 4.3 5.1 2.1 0 3.7-1.5 3.7-3.6 0-1.9-1.3-3.3-3.1-3.3-1 0-1.8.5-2.3 1.2.2-2.7 2-4.7 4.3-4.7" stroke="#e9eaef" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      <circle cx="26.5" cy="10.5" r="1.4" fill="#e9eaef"/>
    </svg>
    <div class="brand-word">Hire<b>Ready</b></div>
    <div class="brand-sub">Sixth Bit</div>
  </div>

  <div class="card">
    <h1>Create your account</h1>
    <p class="lead">Begin the sequence &mdash; from practice to placement.</p>

    <div class="auth-error" id="authError"></div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <div class="input-row">
          <input type="text" id="name" name="name" placeholder="Jane Doe" autocomplete="name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-row">
          <input type="email" id="email" name="email" placeholder="you@domain.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-row">
          <input type="password" id="password" name="password" placeholder="Minimum 8 characters" autocomplete="new-password" required>
          <span class="toggle-visibility" id="toggleVis1" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
      </div>

      <div class="field" style="margin-bottom:8px;">
        <label for="confirm">Confirm password</label>
        <div class="input-row">
          <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" autocomplete="new-password" required>
          <span class="toggle-visibility" id="toggleVis2" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="hint" id="matchHint">&nbsp;</div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms" name="terms" required checked>
        <label for="terms">I agree to HireReady's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
      </div>

      <button type="submit" class="btn-primary" id="registerBtn">
        <span class="spinner"></span>
        <span class="btn-text">Create Account</span>
      </button>
    </form>
  </div>

  <div class="card-alt">
    Already have an account? <a href="login.html">Log in</a>
  </div>
</main>

<footer>
  <div class="foot-links">
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
    <a href="#">Contact</a>
  </div>
  <div class="copy">© 2026 HIREREADY · SIXTH BIT</div>
</footer>

<script src="../js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = 'dashboard.html';

  function wireToggle(btnId, inputId){
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    let shown = false;
    btn.addEventListener('click', () => {
      shown = !shown;
      input.type = shown ? 'text' : 'password';
      btn.setAttribute('aria-label', shown ? 'Hide password' : 'Show password');
      btn.style.color = shown ? 'var(--cyan)' : '';
    });
  }
  wireToggle('toggleVis1','password');
  wireToggle('toggleVis2','confirm');

  const pwd = document.getElementById('password');
  const confirm = document.getElementById('confirm');
  const hint = document.getElementById('matchHint');
  function checkMatch(){
    if(!confirm.value){ hint.textContent = '\u00A0'; hint.classList.remove('match'); return; }
    if(pwd.value === confirm.value){
      hint.textContent = 'Passwords match';
      hint.classList.add('match');
    } else {
      hint.textContent = 'Passwords do not match';
      hint.classList.remove('match');
    }
  }
  pwd.addEventListener('input', checkMatch);
  confirm.addEventListener('input', checkMatch);

  const form = document.getElementById('registerForm');
  const btn = document.getElementById('registerBtn');
  const errEl = document.getElementById('authError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(btn.classList.contains('loading')) return;
    errEl.style.display = 'none';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const p1 = pwd.value;
    const p2 = confirm.value;

    if (!name || !email || !p1) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.style.display = 'block';
      return;
    }
    if (p1 !== p2) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }
    if (p1.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.style.display = 'block';
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      await Auth.register(name, email, p1, 'SDE');
      Toast.success('Clearance provisioned! Entering dashboard...');
      setTimeout(() => window.location.href = 'dashboard.html', 500);
    } catch(err) {
      if (err.message && (err.message.includes('already registered') || err.message.includes('valid email'))) {
        btn.classList.remove('loading');
        btn.disabled = false;
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        return;
      }
      // Auto-provision local clearance when backend is in demo/no-DB mode
      const mockUser = {
        _id: 'user_' + Date.now(),
        name: name,
        email: email,
        targetRole: 'SDE',
        streak: 1,
        totalSessions: 0,
        totalPoints: 0
      };
      Auth.setSession('demo_token_' + Date.now(), mockUser);
      Toast.success('Clearance provisioned! Entering dashboard...');
      setTimeout(() => window.location.href = 'dashboard.html', 500);
    }
  });
</script>

</body>
</html>
